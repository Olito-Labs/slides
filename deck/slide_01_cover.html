<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cover — /slides Skill Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f3ee;
      --gold: #5c4a12;
      --gold-light: #4a3d10;
      --gold-glow: rgba(92, 74, 18, 0.12);
      --gold-subtle: rgba(92, 74, 18, 0.06);
      --gold-border: rgba(92, 74, 18, 0.40);
      --gold-card-fill: rgba(92, 74, 18, 0.06);
      --gold-card-border: rgba(92, 74, 18, 0.25);
      --card-fill: rgba(10, 25, 41, 0.05);
      --card-border: rgba(10, 25, 41, 0.12);
      --text-primary: #0a1929;
      --text-secondary: #162d48;
      --text-muted: #3a5068;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Outfit', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }

    .slide {
      width: 1920px;
      height: 1080px;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .ambient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 28% 42%, rgba(92, 74, 18, 0.09) 0%, transparent 55%),
        radial-gradient(ellipse at 78% 68%, rgba(10, 25, 41, 0.05) 0%, transparent 45%);
      pointer-events: none;
    }

    .contours {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .contours svg { width: 100%; height: 100%; }

    .corner {
      position: absolute;
      width: 100px;
      height: 100px;
      border-color: var(--gold-border);
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top: 40px; left: 40px; border-top-width: 1.5px; border-left-width: 1.5px; }
    .corner.br { bottom: 40px; right: 40px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 48px 56px 0;
      position: relative;
      z-index: 10;
    }
    .logo-cluster { display: flex; align-items: center; gap: 16px; }
    .logo-icon { height: 44px; width: auto; }
    .logo-text {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .header-date {
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 100px;
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .slash-command {
      font-family: var(--font-body);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold-card-fill);
      border: 1.5px solid var(--gold-card-border);
      border-radius: 100px;
      padding: 12px 32px;
    }
    .slash-command .slash {
      font-size: 28px;
      font-weight: 300;
      color: var(--gold);
      opacity: 0.6;
    }

    .hero-title {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: 86px;
      color: var(--text-primary);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    .hero-title em {
      font-weight: 500;
      font-style: italic;
      color: var(--gold);
    }

    .hero-subtitle {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 28px;
      color: var(--text-secondary);
      line-height: 1.55;
      max-width: 780px;
      margin-bottom: 48px;
    }

    .gold-divider {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin-bottom: 48px;
    }

    .badge-row {
      display: flex;
      gap: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--gold-card-fill);
      border: 1.5px solid var(--gold-card-border);
      border-radius: 100px;
      padding: 14px 28px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }
    .badge-text {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 24px 56px 48px;
      position: relative;
      z-index: 10;
    }
    .footer-label {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="slide">
    <div class="ambient"></div>
    <div class="contours">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" fill="none">
        <path d="M -50 260 Q 400 380 960 400 Q 1520 380 1970 260" stroke="rgba(92,74,18,0.035)" stroke-width="1"/>
        <path d="M -50 340 Q 400 450 960 470 Q 1520 450 1970 340" stroke="rgba(92,74,18,0.025)" stroke-width="1"/>
        <path d="M -80 800 Q 350 720 960 700 Q 1570 720 2000 800" stroke="rgba(92,74,18,0.03)" stroke-width="1"/>
        <path d="M -80 870 Q 350 800 960 780 Q 1570 800 2000 870" stroke="rgba(92,74,18,0.02)" stroke-width="1"/>
      </svg>
    </div>
    <div class="corner tl"></div>
    <div class="corner br"></div>

    <header class="header">
      <div class="logo-cluster">
        <img class="logo-icon" src="assets/logo.png" alt="Logo" />
        <span class="logo-text">Olito Labs</span>
      </div>
      <span class="header-date">March 2026</span>
    </header>

    <div class="content">
      <div class="slash-command">
        <span class="slash">/</span>slides
      </div>
      <h1 class="hero-title">Narrative-First<br/><em>Presentations</em></h1>
      <p class="hero-subtitle">
        A Claude Code skill that turns plain-language prompts into McKinsey-grade HTML slide decks with one-command PDF export.
      </p>
      <div class="gold-divider"></div>
      <div class="badge-row">
        <div class="badge">
          <div class="badge-dot"></div>
          <span class="badge-text">Pyramid Principle</span>
        </div>
        <div class="badge">
          <div class="badge-dot"></div>
          <span class="badge-text">Pixel-Perfect HTML</span>
        </div>
        <div class="badge">
          <div class="badge-dot"></div>
          <span class="badge-text">PDF Export</span>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span class="footer-label">Olito Labs &middot; Skills</span>
      <span class="footer-label">olitolabs.com</span>
    </footer>
  </div>
</body>

</html>
